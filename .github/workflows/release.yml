name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version with v prefix (for example v0.1.0-alpha.3)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require verified current main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: await require('./.github/scripts/release-gate.cjs')({github, context});
      - run: python -m pip install -r python/requirements.txt
      - run: npm run verify
      - name: Build source archive and checksum
        shell: pwsh
        run: |
          $archive = '.local/release/win-cu-router-' + $env:RELEASE_VERSION + '.zip'
          python scripts/package-release.py --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-package.py --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower()
          "$sum  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8NoBOM
      - name: Recheck main before publication
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: await require('./.github/scripts/release-gate.cjs')({github, context});
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = '.local/release/win-cu-router-' + $env:RELEASE_VERSION + '.zip'
          gh release create $env:RELEASE_VERSION $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "win-cu-router $env:RELEASE_VERSION" --notes-file docs/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and validate published archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --dir .local/downloaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = 'win-cu-router-' + $env:RELEASE_VERSION + '.zip'
          $archive = '.local/downloaded/' + $name
          $expected = (Get-Content -LiteralPath "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Published checksum mismatch' }
          python scripts/smoke-package.py --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release verification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          path: .local/workflow/verification.json
          if-no-files-found: warn
