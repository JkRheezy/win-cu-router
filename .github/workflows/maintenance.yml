name: maintenance
on:
  workflow_run:
    workflows: [verify, release]
    types: [completed]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: maintenance-intake
  cancel-in-progress: false
jobs:
  intake:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Privileged workflow_run jobs must never execute the failing PR's code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const {upsertFailure, intakeFromIssue} = require('./.github/scripts/feedback.cjs');
            let issue = context.payload.issue;
            if (!issue) {
              const source = context.payload.workflow_run;
              const drill = context.eventName === 'workflow_dispatch';
              issue = await upsertFailure({github, context, run: {
                workflow: drill ? 'maintenance-drill' : source.name,
                sha: drill ? context.sha : source.head_sha,
                url: drill ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` : source.html_url,
                drill
              }});
            }
            fs.mkdirSync('.local/maintenance', {recursive: true});
            fs.writeFileSync(`.local/maintenance/issue-${issue.number}.json`, JSON.stringify(intakeFromIssue(issue), null, 2));
            await core.summary.addHeading('Maintenance intake').addLink(`Issue #${issue.number}`, issue.html_url).addRaw('\nRequires maintainer triage; no issue text is executed.').write();
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-intake
          path: .local/maintenance/*.json
          if-no-files-found: error
